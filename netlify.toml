[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Required env vars (set in Netlify Dashboard → Site Settings → Environment Variables):
  #   STRIPE_SECRET_KEY        — sk_live_... or sk_test_... from stripe.com/dashboard/apikeys
  #   STRIPE_WEBHOOK_SECRET    — whsec_... from Stripe webhook endpoint settings
  #   NETLIFY_IDENTITY_URL     — auto-set by Netlify when Identity is enabled (optional override)
  #   LOW_STOCK_THRESHOLD      — integer, default 5 (units before "low stock" warning)
  #   PLAUSIBLE_API_KEY        — from plausible.io/settings/api
  #   PLAUSIBLE_SITE_ID        — your domain as registered in Plausible (e.g. yoursite.com)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Admin SPA — serve index.html for /admin and /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# Stripe webhook — clean URL for the webhook endpoint
[[redirects]]
  from = "/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
