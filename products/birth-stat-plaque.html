<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Birth-Stat Plaque — Cut & Curated Keepsakes</title>
  <meta name="description" content="Custom hand-poured resin baby birth stat plaque with baby's name, birth date, time, weight and length. A one-of-a-kind keepsake made to order in Edmond, Oklahoma.">
  <meta name="keywords" content="custom baby birth stat plaque, resin birth keepsake, personalized baby plaque Oklahoma, handmade baby gift, birth announcement plaque">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="shop" data-subpage="true" data-product-id="birth-stat-plaque" itemscope itemtype="https://schema.org/Product">
  <div id="nav-mount"></div>

  <main class="product-page-wrap">
    <div class="container">
      <!-- Breadcrumb -->
      <nav aria-label="Breadcrumb" class="breadcrumb">
        <a href="../index.html">Home</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <a href="../shop.html">Shop</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <span aria-current="page">Baby Birth-Stat Plaque</span>
      </nav>

      <!-- Product content injected by main.js based on data-product-id -->
      <div id="product-page-content"></div>
    </div>

    <!-- Related products -->
    <section class="section" style="background:var(--cream-deep);" aria-labelledby="related-heading">
      <div class="container">
        <div class="section-header">
          <h2 id="related-heading">You might also love</h2>
        </div>
        <div class="product-grid" id="related-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Render related products (all resin except this one)
      const relatedGrid = document.getElementById('related-grid');
      if (relatedGrid) {
        const related = PRODUCTS.filter(p => p.category === 'resin' && p.id !== 'birth-stat-plaque').slice(0, 3);
        if (!related.length) {
          const fallback = PRODUCTS.filter(p => p.id !== 'birth-stat-plaque').slice(0, 3);
          related.push(...fallback);
        }
        relatedGrid.innerHTML = related.map(p => `
          <article class="product-card">
            <a href="${p.id}.html" class="product-card-image-link" tabindex="-1" aria-hidden="true">
              <div class="product-card-image">
                <img src="../${p.image}" alt="${p.imageAlt}" loading="lazy" onerror="this.src='../images/placeholder.svg'">
              </div>
            </a>
            <div class="product-card-body">
              <p class="product-card-category">${p.categoryLabel}</p>
              <h3 class="product-card-name"><a href="${p.id}.html">${p.name}</a></h3>
              <div class="product-card-footer">
                <span class="product-card-price">${p.displayPrice}</span>
                <a href="${p.id}.html" class="btn btn-outline btn-sm">View</a>
              </div>
            </div>
          </article>
        `).join('');
      }
    });
  </script>
</body>
</html>
